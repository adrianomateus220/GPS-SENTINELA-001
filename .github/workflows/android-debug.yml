name: Compilar APK offline de teste
on:
  push:
    branches: [main, master, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Testar, compilar e verificar
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleDebugAndroidTest lintDebug
      - uses: actions/cache@v4
        with:
          path: /tmp/sentinela-data
          key: sentinela-sudeste-2026-10
      - name: Baixar dados reais para teste offline
        run: |
          mkdir -p /tmp/sentinela-data
          test -s /tmp/sentinela-data/sudeste.map || curl --fail --location --retry 2 --max-time 600 https://download.mapsforge.org/maps/v5/south-america/brazil/sudeste.map -o /tmp/sentinela-data/sudeste.map
          test -s /tmp/sentinela-data/SP.json || curl --fail --location --retry 2 https://raw.githubusercontent.com/luizpedone/municipal-brazilian-geodata/master/minified/SP.min.json -o /tmp/sentinela-data/SP.json
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Teste Android sem rede
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash tests/offline-device.sh
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Sentinela-0.7-offline-teste
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verificacao-offline
          path: app/build/reports/
          if-no-files-found: ignore
