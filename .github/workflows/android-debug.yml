name: Compilar APK de teste
on:
  push:
    branches: [main, master, codex/sentinela-0.5]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Testar interface móvel
        run: |
          npm install --prefix "$RUNNER_TEMP/sentinela-ui" playwright@1.56.1
          node "$RUNNER_TEMP/sentinela-ui/node_modules/playwright/cli.js" install --with-deps chromium
          python3 -m http.server 8765 --directory app/src/main/assets >/tmp/sentinela-http.log 2>&1 &
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/sentinela-ui/node_modules/playwright" node tests/ui.test.cjs
      - name: Compilar e verificar
        run: gradle --no-daemon --stacktrace assembleDebug lintDebug
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Sentinela-APK-teste
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Relatório de verificação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verificacao-android
          path: app/build/reports/
          if-no-files-found: ignore
