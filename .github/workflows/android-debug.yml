name: Compilar APK offline de teste
on:
  push:
    branches: [main, master, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Testar, compilar e verificar
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug lintDebug
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Sentinela-0.7-offline-teste
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verificacao-offline
          path: app/build/reports/
          if-no-files-found: ignore
