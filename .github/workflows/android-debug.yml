name: Compilar APK de teste
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar e verificar
        run: gradle --no-daemon --stacktrace assembleDebug lintDebug
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Sentinela-APK-teste
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Relatório de verificação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verificacao-android
          path: app/build/reports/
          if-no-files-found: ignore
